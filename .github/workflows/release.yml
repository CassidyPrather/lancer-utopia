name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches module.json
        run: |
          version=$(jq -r .version module.json)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "module.json version v$version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Package
        run: zip -r utopia.zip module.json scripts styles LICENSE README.md

      - name: Publish the release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "module.json,utopia.zip"
          generateReleaseNotes: true
          makeLatest: true
